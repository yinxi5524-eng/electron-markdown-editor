<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, 
                         Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .about-container {
            text-align: center;
        }
        .author-photo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            display: block;
            border: 3px solid #3498db;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .version {
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        .author-name {
            font-size: 1.2em;
            margin: 15px 0;
            color: #2c3e50;
        }
        .close-btn {
            background-color: #16a085;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        .close-btn:hover {
            background-color: #12876f;
        }
    </style>
</head>
<body>
    <div class="about-container">
       
        <img src="./images/image2.png" class="author-photo" alt="Author Photo">
        
        <h1>2026年底的风吹来一个markdown编辑器</h1>
        <div class="version">版本 1.0.0</div>

        <div class="author-name">由 <strong>yinxi5524-eng</strong> 改造</div>

        <p>基于 Electron.js 的 Markdown 笔记应用（Fork 自 Achintha-999）</p>

        <button class="close-btn" id="close-btn">关闭</button>
    </div>

    <script>
        document.getElementById('close-btn').addEventListener('click', () => {
            window.close();
        });
    </script>
</body>
</html>
